name: daily-post

on:
  schedule:
    # 정시 준비는 Cloudflare 알람(KST 02:15·04:15·14:15·16:15, mode=auto)이 맡고 cron은 슬롯당 예비 1번 (UTC).
    # KST 05:17 → 08:00 글, 17:17 → 20:00 글. 할 일 없는 실행도 1분씩 청구돼 2시간마다에서 줄였다 (2026-10-24).
    # 발행 시각 자체는 Blogger 예약이 정확히 지키고, 각 시각마다 준비 기회가 3번 있다.
    - cron: '17 20,8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto=설정된 시각 중 곧 돌아오는 것 준비 / schedule=다음 시각 1편 예약 / draft=초안 / now=즉시 발행 / preview=미리보기'
        type: choice
        options: [auto, schedule, draft, now, preview]
        default: preview
      at:
        description: 'schedule 모드에서만: 예약 시각 HH:MM (KST). 비우면 설정된 다음 시각'
        type: string
        required: false

# 수동 실행과 정기 실행이 겹쳐도 한 번에 하나씩만 돈다 (중복 발행 방지)
concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write   # data/history.json, data/runs.jsonl 커밋용

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES || '20:00' }}
      PAUSED: ${{ vars.PAUSED || 'false' }}
      HOWTO_TIME: ${{ vars.HOWTO_TIME }}   # 비우면 08:00,20:00 (생활 가이드 칸). 08:00을 뉴스로 되돌리려면 20:00
    steps:
      - uses: actions/checkout@v4

      # cron과 Cloudflare 알람(mode=auto)은 준비할 슬롯이 있을 때만 무거운 단계로 넘어간다.
      # 다른 수동 모드는 이 점검을 건너뛰므로 due가 비어 있고, 아래 조건(!= 'false')에서 항상 실행된다.
      - name: Check due slots
        id: due
        if: github.event_name == 'schedule' || inputs.mode == 'auto'
        run: python3 scripts/due_check.py

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Korean fonts
        # 대표 이미지에 썸네일 문구를 얹을 굵은 한글 글꼴 (src/thumbnail.py). 설치에 실패해도 문구 없이 발행한다
        if: steps.due.outputs.due != 'false'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        if: steps.due.outputs.due != 'false'
        run: pip install -r requirements-dev.txt

      - name: Run tests
        if: steps.due.outputs.due != 'false'
        run: python -m pytest -q

      - name: Generate and publish
        if: steps.due.outputs.due != 'false'
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GPTPROTO_API_KEY: ${{ secrets.GPTPROTO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT_PROVIDER: ${{ vars.TEXT_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          FAST_MODEL: ${{ vars.FAST_MODEL }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY }}
          FOOTER_LINK_URL: ${{ vars.FOOTER_LINK_URL || 'https://link.inpock.co.kr/shoperwoody' }}
          MODE: ${{ inputs.mode || 'auto' }}
          AT: ${{ inputs.at }}
        run: |
          if [ -n "$AT" ]; then
            python -m src.main --mode "$MODE" --at "$AT"
          else
            python -m src.main --mode "$MODE"
          fi

      - name: Upload preview
        if: always() && inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit history and run log
        if: always() && (steps.due.outputs.due != 'false')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/runs.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "기록 변경 없음"
          else
            git commit -m "chore: update post history and run log [skip ci]"
            git pull --rebase --quiet
            git push
          fi
