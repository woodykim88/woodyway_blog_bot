name: search-console

on:
  schedule:
    - cron: '30 22 * * *'   # KST 07:30 매일 (숫자는 2~3일 늦게 들어오므로 정시일 필요 없음)
  workflow_dispatch:

concurrency:
  group: daily-post   # 기록 파일 커밋이 발행 작업과 겹치지 않게
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Collect Search Console
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m src.search_console
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search_console.json data/search_console.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update search console report [skip ci]"
            git pull --rebase --quiet
            git push
          fi
